name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . ../../data/seed
      - name: Format
        run: ruff format --check . ../../data/seed
      - name: Test
        run: pytest -q
      - name: OpenAPI schema is up to date
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- ../../apps/web/openapi.json \
            || (echo "::error::Run 'python scripts/export_openapi.py' and commit apps/web/openapi.json" && exit 1)

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code -- lib/api-types.ts \
            || (echo "::error::Run 'pnpm gen:api' and commit lib/api-types.ts" && exit 1)
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
