[project]
name = "rm-copilot-agent"
version = "0.1.0"
description = "Agent + data service for RM Copilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "faker>=30"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
